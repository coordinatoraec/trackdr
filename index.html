<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4a90d9">
    <meta name="description" content="Транскрибатор - распознавание речи с разделением по спикерам">
    <title>Транскрибатор</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 700px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
            text-align: center;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 25px;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
        }

        .btn {
            padding: 15px 30px;
            font-size: 1.1em;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: bold;
            border: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-record {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
        }

        .btn-record.recording {
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
            animation: pulse 1s infinite;
        }

        .btn-stop {
            background: linear-gradient(135deg, #95a5a6 0%, #7f8c8d 100%);
            color: white;
        }

        .btn-copy {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: white;
        }

        .btn-clear {
            background: linear-gradient(135deg, #e67e22 0%, #d35400 100%);
            color: white;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .speaker-selector {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f5f5f5;
            padding: 10px 20px;
            border-radius: 50px;
        }

        .speaker-selector label {
            font-weight: bold;
            color: #333;
        }

        .speaker-selector select {
            padding: 8px 15px;
            border-radius: 25px;
            border: 2px solid #667eea;
            font-size: 1em;
            cursor: pointer;
            outline: none;
        }

        .status {
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .status.idle {
            background: #f0f0f0;
            color: #666;
        }

        .status.recording {
            background: #ffeaea;
            color: #e74c3c;
        }

        .status.paused {
            background: #e8f5e9;
            color: #27ae60;
        }

        .transcript-container {
            background: #f9f9f9;
            border-radius: 15px;
            padding: 20px;
            min-height: 300px;
            max-height: 500px;
            overflow-y: auto;
            border: 2px solid #e0e0e0;
        }

        .transcript-line {
            margin-bottom: 15px;
            padding: 12px 15px;
            border-radius: 10px;
            line-height: 1.5;
        }

        .speaker-1 {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
        }

        .speaker-2 {
            background: #fce4ec;
            border-left: 4px solid #e91e63;
        }

        .speaker-3 {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
        }

        .speaker-4 {
            background: #fff3e0;
            border-left: 4px solid #ff9800;
        }

        .speaker-label {
            font-weight: bold;
            font-size: 0.85em;
            margin-bottom: 5px;
            opacity: 0.8;
        }

        .speaker-1 .speaker-label { color: #1976d2; }
        .speaker-2 .speaker-label { color: #c2185b; }
        .speaker-3 .speaker-label { color: #388e3c; }
        .speaker-4 .speaker-label { color: #f57c00; }

        .transcript-text {
            color: #333;
            font-size: 1em;
        }

        .current-speaker-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .indicator-1 { background: #2196f3; }
        .indicator-2 { background: #e91e63; }
        .indicator-3 { background: #4caf50; }
        .indicator-4 { background: #ff9800; }

        .hidden {
            display: none;
        }

        .copy-notification {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 1000;
        }

        .copy-notification.show {
            opacity: 1;
        }

        .recording-time {
            font-size: 1.2em;
            font-weight: bold;
            color: #666;
            margin-left: 15px;
        }

        .speaker-names-btn {
            background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            border: none;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s;
        }

        .speaker-names-btn:hover {
            transform: translateY(-2px);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal h2 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }

        .speaker-name-input {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 10px;
        }

        .speaker-name-input input {
            flex: 1;
            padding: 10px 15px;
            border: 2px solid #667eea;
            border-radius: 25px;
            font-size: 1em;
            outline: none;
        }

        .speaker-name-input input:focus {
            border-color: #9b59b6;
        }

        .speaker-color-indicator {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .modal-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            justify-content: center;
        }

        .btn-save {
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
            color: white;
        }

        .btn-cancel {
            background: linear-gradient(135deg, #95a5a6 0%, #7f8c8d 100%);
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎙️ Транскрибатор</h1>
        <p class="subtitle">Распознавание речи с разделением по спикерам</p>
        
        <div class="controls">
            <button class="btn btn-record" id="record-btn" onclick="toggleRecording()">
                <span id="record-icon">🎤</span>
                <span id="record-text">Начать запись</span>
            </button>
            
            <div class="speaker-selector">
                <label>Спикер:</label>
                <select id="speaker-select" onchange="changeSpeaker()">
                    <option value="1">🔵 Спикер 1</option>
                    <option value="2">🔴 Спикер 2</option>
                    <option value="3">🟢 Спикер 3</option>
                    <option value="4">🟠 Спикер 4</option>
                </select>
                <span class="current-speaker-indicator indicator-1" id="speaker-indicator"></span>
            </div>
            
            <button class="btn speaker-names-btn" onclick="openSpeakerNamesModal()">
                ✏️ Имена спикеров
            </button>
            
            <span class="recording-time" id="recording-time">00:00</span>
        </div>

        <div class="status idle" id="status">
            Нажмите "Начать запись" для старта
        </div>

        <div class="transcript-container" id="transcript-container">
            <p style="color: #999; text-align: center; margin-top: 100px;">
                Здесь появится распознанный текст...
            </p>
        </div>

        <div class="controls" style="margin-top: 20px;">
            <button class="btn btn-copy" onclick="copyTranscript()">
                📋 Копировать текст
            </button>
            <button class="btn btn-clear" onclick="clearTranscript()">
                🗑️ Очистить
            </button>
        </div>
    </div>

    <div class="copy-notification" id="copy-notification">
        Текст скопирован в буфер обмена!
    </div>

    <div class="modal-overlay" id="speaker-names-modal">
        <div class="modal">
            <h2>✏️ Назначить имена спикерам</h2>
            
            <div class="speaker-name-input">
                <span class="speaker-color-indicator indicator-1"></span>
                <input type="text" id="speaker-name-1" placeholder="Имя для Спикера 1" value="Спикер 1">
            </div>
            
            <div class="speaker-name-input">
                <span class="speaker-color-indicator indicator-2"></span>
                <input type="text" id="speaker-name-2" placeholder="Имя для Спикера 2" value="Спикер 2">
            </div>
            
            <div class="speaker-name-input">
                <span class="speaker-color-indicator indicator-3"></span>
                <input type="text" id="speaker-name-3" placeholder="Имя для Спикера 3" value="Спикер 3">
            </div>
            
            <div class="speaker-name-input">
                <span class="speaker-color-indicator indicator-4"></span>
                <input type="text" id="speaker-name-4" placeholder="Имя для Спикера 4" value="Спикер 4">
            </div>
            
            <div class="modal-buttons">
                <button class="btn btn-save" onclick="saveSpeakerNames()">💾 Сохранить</button>
                <button class="btn btn-cancel" onclick="closeSpeakerNamesModal()">❌ Отмена</button>
            </div>
        </div>
    </div>

    <script>
        let recognition = null;
        let isRecording = false;
        let currentSpeaker = '1';
        let transcriptData = [];
        let recordingStartTime = null;
        let recordingTimer = null;
        
        // Имена спикеров по умолчанию
        let speakerNames = {
            '1': 'Спикер 1',
            '2': 'Спикер 2',
            '3': 'Спикер 3',
            '4': 'Спикер 4'
        };

        // Проверка поддержки Web Speech API
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            alert('Ваш браузер не поддерживает распознавание речи. Пожалуйста, используйте Google Chrome или другой поддерживаемый браузер.');
        } else {
            initRecognition();
        }

        function initRecognition() {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'ru-RU';

            recognition.onstart = function() {
                isRecording = true;
                updateUI();
                startRecordingTimer();
            };

            recognition.onend = function() {
                if (isRecording) {
                    recognition.start();
                } else {
                    stopRecordingTimer();
                    updateUI();
                }
            };

            recognition.onresult = function(event) {
                let interimTranscript = '';
                let finalTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalTranscript += transcript;
                    } else {
                        interimTranscript += transcript;
                    }
                }

                if (finalTranscript) {
                    addTranscriptLine(finalTranscript, currentSpeaker);
                }
            };

            recognition.onerror = function(event) {
                console.error('Ошибка распознавания:', event.error);
                const statusEl = document.getElementById('status');
                
                if (event.error === 'no-speech') {
                    statusEl.textContent = '⚠️ Речь не обнаружена. Попробуйте говорить громче.';
                } else if (event.error === 'audio-capture') {
                    statusEl.textContent = '⚠️ Микрофон не найден. Проверьте подключение.';
                } else if (event.error === 'not-allowed') {
                    statusEl.textContent = '⚠️ Доступ к микрофону запрещен.';
                    isRecording = false;
                } else {
                    statusEl.textContent = '⚠️ Ошибка: ' + event.error;
                }
                
                statusEl.className = 'status paused';
            };
        }

        function toggleRecording() {
            if (!recognition) return;

            if (isRecording) {
                isRecording = false;
                recognition.stop();
            } else {
                recognition.start();
            }
        }

        function changeSpeaker() {
            currentSpeaker = document.getElementById('speaker-select').value;
            updateSpeakerIndicator();
        }

        function updateSpeakerIndicator() {
            const indicator = document.getElementById('speaker-indicator');
            indicator.className = 'current-speaker-indicator indicator-' + currentSpeaker;
        }

        function addTranscriptLine(text, speaker) {
            const container = document.getElementById('transcript-container');
            
            // Удаляем placeholder если он есть
            const placeholder = container.querySelector('p[style*="text-align: center"]');
            if (placeholder) {
                placeholder.remove();
            }

            const transcriptObj = {
                speaker: speaker,
                text: text,
                timestamp: new Date()
            };
            
            transcriptData.push(transcriptObj);

            const lineDiv = document.createElement('div');
            lineDiv.className = 'transcript-line speaker-' + speaker;
            
            lineDiv.innerHTML = `
                <div class="speaker-label">${speakerNames[speaker]}</div>
                <div class="transcript-text">${escapeHtml(text)}</div>
            `;

            container.appendChild(lineDiv);
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function updateUI() {
            const recordBtn = document.getElementById('record-btn');
            const recordIcon = document.getElementById('record-icon');
            const recordText = document.getElementById('record-text');
            const statusEl = document.getElementById('status');
            const speakerSelect = document.getElementById('speaker-select');

            if (isRecording) {
                recordBtn.classList.add('recording');
                recordIcon.textContent = '⏹️';
                recordText.textContent = 'Остановить';
                statusEl.textContent = '🔴 Запись идет... Выберите спикера перед началом речи';
                statusEl.className = 'status recording';
                speakerSelect.disabled = false;
            } else {
                recordBtn.classList.remove('recording');
                recordIcon.textContent = '🎤';
                recordText.textContent = 'Начать запись';
                statusEl.textContent = '⏸️ Запись остановлена';
                statusEl.className = 'status paused';
                speakerSelect.disabled = false;
            }
        }

        function startRecordingTimer() {
            recordingStartTime = Date.now();
            recordingTimer = setInterval(updateRecordingTime, 1000);
        }

        function stopRecordingTimer() {
            if (recordingTimer) {
                clearInterval(recordingTimer);
                recordingTimer = null;
            }
        }

        function updateRecordingTime() {
            if (!recordingStartTime) return;
            
            const elapsed = Math.floor((Date.now() - recordingStartTime) / 1000);
            const minutes = Math.floor(elapsed / 60).toString().padStart(2, '0');
            const seconds = (elapsed % 60).toString().padStart(2, '0');
            
            document.getElementById('recording-time').textContent = `${minutes}:${seconds}`;
        }

        function getFullTranscript() {
            return transcriptData.map(item => {
                return `${speakerNames[item.speaker]}: ${item.text}`;
            }).join('\n');
        }

        function copyTranscript() {
            const text = getFullTranscript();
            
            if (!text) {
                alert('Нет текста для копирования');
                return;
            }

            navigator.clipboard.writeText(text).then(() => {
                showNotification();
            }).catch(err => {
                // Fallback для старых браузеров
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showNotification();
            });
        }

        function showNotification() {
            const notification = document.getElementById('copy-notification');
            notification.classList.add('show');
            setTimeout(() => {
                notification.classList.remove('show');
            }, 2000);
        }

        function clearTranscript() {
            if (transcriptData.length === 0) return;
            
            if (confirm('Вы уверены, что хотите очистить весь текст?')) {
                transcriptData = [];
                const container = document.getElementById('transcript-container');
                container.innerHTML = `
                    <p style="color: #999; text-align: center; margin-top: 100px;">
                        Здесь появится распознанный текст...
                    </p>
                `;
            }
        }

        // Функции для управления именами спикеров
        function openSpeakerNamesModal() {
            // Загружаем текущие имена в поля ввода
            for (let i = 1; i <= 4; i++) {
                document.getElementById('speaker-name-' + i).value = speakerNames[i.toString()];
            }
            document.getElementById('speaker-names-modal').classList.add('show');
        }

        function closeSpeakerNamesModal() {
            document.getElementById('speaker-names-modal').classList.remove('show');
        }

        function saveSpeakerNames() {
            // Сохраняем имена из полей ввода
            for (let i = 1; i <= 4; i++) {
                const name = document.getElementById('speaker-name-' + i).value.trim();
                if (name) {
                    speakerNames[i.toString()] = name;
                }
            }
            closeSpeakerNamesModal();
        }

        // Закрытие модального окна при клике вне его
        document.getElementById('speaker-names-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeSpeakerNamesModal();
            }
        });

        // Закрытие модального окна по клавише Escape
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeSpeakerNamesModal();
            }
        });

        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('Service Worker registered:', reg))
                .catch(err => console.log('Service Worker registration failed:', err));
        }
    </script>
</body>
</html>
